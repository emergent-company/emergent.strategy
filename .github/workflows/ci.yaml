name: EPF CLI CI

on:
  push:
    branches: [main]
    paths:
      - "apps/epf-cli/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "apps/epf-cli/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      # Build epf-cli in isolation, ignoring the repo's go.work.
      #
      # epf-cli is frozen and pins Go 1.25.1, while sibling modules in the
      # workspace track a newer floor (strategy-server needs 1.26.5 for ADK v2).
      # Without this, the workspace floor would force this job to download a
      # newer toolchain it does not need — and would fail outright on a runner
      # that cannot fetch toolchains. GOWORK=off also matches how epf-cli is
      # actually consumed: as a standalone module.
      GOWORK: "off"
    steps:
      # Short-lived installation token for the CI-only GitHub App
      # (emergent-strategy-ci, App ID in EPF_CANONICAL_APP_ID). Read-only
      # Contents access, installed only on epf-canonical + emergent-epf —
      # deliberately NOT on this repo, so it cannot authenticate the main
      # checkout. It only covers the submodule fetch and the canonical clone
      # below. The main checkout keeps using the default GITHUB_TOKEN (already
      # granted contents:read on this repo via the `permissions` block above).
      #
      # Replaces the EPF_CANONICAL_TOKEN static PAT, which silently expired
      # and broke this check for every PR from 2026-06-08 onward — see #73.
      - name: Generate canonical EPF access token
        id: canonical-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.EPF_CANONICAL_APP_ID }}
          private-key: ${{ secrets.EPF_CANONICAL_APP_PRIVATE_KEY }}
          owner: emergent-company
          repositories: |
            epf-canonical
            emergent-epf

      - name: Checkout code (without submodules)
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config submodule.docs/EPF/_instances/emergent.url \
            "https://x-access-token:${{ steps.canonical-app-token.outputs.token }}@github.com/emergent-company/emergent-epf.git"
          git submodule update --init --depth 1

      - name: Read pinned epf-canonical commit
        id: canonical
        run: echo "sha=$(head -n1 .epf-canonical-version)" >> "$GITHUB_OUTPUT"

      # epf-canonical has no tags/releases, so the pin is a commit SHA and
      # we can't use `clone --branch`. Clone shallow at main, then try to
      # checkout the pinned SHA directly — if that SHA has already rolled
      # out of the shallow window, deepen on demand instead of always
      # paying for a full clone.
      - name: Clone epf-canonical at pinned commit
        run: |
          git clone --depth 1 "https://x-access-token:${{ steps.canonical-app-token.outputs.token }}@github.com/emergent-company/epf-canonical.git" "$RUNNER_TEMP/canonical-epf"
          cd "$RUNNER_TEMP/canonical-epf"
          git fetch --depth 1 origin "${{ steps.canonical.outputs.sha }}"
          git checkout "${{ steps.canonical.outputs.sha }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/epf-cli/go.mod
          cache-dependency-path: apps/epf-cli/go.sum

      - name: Sync embedded artifacts
        run: ./scripts/sync-embedded.sh "$RUNNER_TEMP/canonical-epf"
        working-directory: apps/epf-cli

      - name: Run tests
        run: go test ./...
        working-directory: apps/epf-cli

      - name: Build
        run: go build -o epf-cli .
        working-directory: apps/epf-cli

      - name: Verify binary
        run: ./epf-cli version
        working-directory: apps/epf-cli
