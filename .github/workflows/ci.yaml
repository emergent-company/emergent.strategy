name: EPF CLI CI

on:
  push:
    branches: [main]
    paths:
      - "apps/epf-cli/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "apps/epf-cli/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      # Build epf-cli in isolation, ignoring the repo's go.work.
      #
      # epf-cli is frozen and pins Go 1.25.1, while sibling modules in the
      # workspace track a newer floor (strategy-server needs 1.26.5 for ADK v2).
      # Without this, the workspace floor would force this job to download a
      # newer toolchain it does not need — and would fail outright on a runner
      # that cannot fetch toolchains. GOWORK=off also matches how epf-cli is
      # actually consumed: as a standalone module.
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.EPF_CANONICAL_TOKEN }}
          submodules: true

      - name: Clone epf-canonical
        run: git clone --depth 1 https://x-access-token:${{ secrets.EPF_CANONICAL_TOKEN }}@github.com/emergent-company/epf-canonical.git "$RUNNER_TEMP/canonical-epf"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/epf-cli/go.mod
          cache-dependency-path: apps/epf-cli/go.sum

      - name: Sync embedded artifacts
        run: ./scripts/sync-embedded.sh "$RUNNER_TEMP/canonical-epf"
        working-directory: apps/epf-cli

      - name: Run tests
        run: go test ./...
        working-directory: apps/epf-cli

      - name: Build
        run: go build -o epf-cli .
        working-directory: apps/epf-cli

      - name: Verify binary
        run: ./epf-cli version
        working-directory: apps/epf-cli
