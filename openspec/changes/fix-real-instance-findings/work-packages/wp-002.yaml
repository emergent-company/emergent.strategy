id: "wp-002"
title: "OKR and Key Result Visibility"
intent: >-
  Every Key Result in the roadmap — whether under okrs or future_okrs_* groups —
  is visible to get_view, AlignPortfolio, and all validators. Components are no
  longer incorrectly marked dormant because the alignment only saw a subset of
  Key Results. A KR-target fitness check surfaces real coverage gaps.
