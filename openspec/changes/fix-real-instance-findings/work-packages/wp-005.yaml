id: "wp-005"
title: "Operational Visibility for GitHub Sync"
intent: >-
  Agents and operators know when GitHub sync is unavailable and why, without
  reading server logs or source code. health_check, get_instance and tool
  descriptions report the sync state, and a stub tool explains the situation
  when the full sync tools are not registered.
