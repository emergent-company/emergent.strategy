id: "wp-003"
title: "Sync and Import Integrity"
intent: >-
  A freshly imported instance reads in_sync or github_ahead (not server_ahead),
  CLI import supports --dry-run for safe re-imports, sync_to_github writes only
  changed artifacts so comments in unchanged files are preserved, and the publish
  PR body is reviewable with batch descriptions and a small diff.
