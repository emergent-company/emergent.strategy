name: draft-calibration
version: "1.1.0"
type: generation
phase: AIM
execution: prompt
description: "Generates the substantive judgment for a calibration_memo artifact: the narrative reasoning plus structured learnings (validated/invalidated assumptions, surprises) and next_cycle_focus (continue/stop/start), all derived from assessment evidence. Receives the pre-computed decision (persevere/pivot/pull_the_plug), OKR hit rate, invalidated assumption count, and formula-based reasoning as parameters. The skill does NOT choose or override the decision, hit rate, or invalidated count — those are copied verbatim."

capability:
  class: balanced
  context_budget: small

requires:
  artifacts:
    - assessment_report

output:
  format: json
  schema: output_schema.json
  artifact_types:
    - calibration_memo
