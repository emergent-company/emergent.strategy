name: adapt-strategy
version: "1.0.0"
type: generation
phase: AIM
description: "Generates full replacement payloads for strategy_formula and roadmap_recipe based on a committed calibration decision. Also produces an LRA evolution entry and updated riskiest assumptions."

capability:
