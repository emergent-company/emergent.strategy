  context_budget: large

requires:
  artifacts:
    - calibration_memo
    - assessment_report
    - strategy_formula
    - roadmap_recipe
    - living_reality_assessment

output:
  format: json
  schema: output_schema.json
  artifact_types:
    - strategy_formula
    - roadmap_recipe
    - living_reality_assessment
