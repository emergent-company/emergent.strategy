# EPF v1.13.0 - Insight Analyses Template
# INSIGHT Phase: Foundational Analyses
# These documents provide the analytical foundation for opportunity identification.
# They are living documents that get refined through multiple cycles based on AIM phase learnings.
# Must be informed by and consistent with organizational North Star (00_north_star.yaml).
#
# CHANGE PROTOCOL: If these analyses change significantly, update 03_insight_opportunity.yaml
#
# Related Resources:
# - Schema: ../../schemas/insight_analyses_schema.json
# - Wizard: ../../wizards/01_trend_scout.agent_prompt.md (Trend Scout)
# - Wizard: ../../wizards/02_market_mapper.agent_prompt.md (Market Mapper)
# - Wizard: ../../wizards/03_internal_mirror.agent_prompt.md (Internal Mirror)
# - Wizard: ../../wizards/04_problem_detective.agent_prompt.md (Problem Detective)

## Document Status
# Each analysis should track when it was last updated and its current confidence level
last_updated: "YYYY-MM-DD" # ISO date of last update
confidence_level: "medium" # low, medium, high
next_review_date: "YYYY-MM-DD" # ISO date of next planned review

## 1. TREND ANALYSIS: Where is the puck skating?
# Understanding macro trends that create opportunities or threats

trends:
  technology:
    - trend: "Example: Rise of AI-powered analytics"
      impact: "How this affects our space (high/medium/low)"
      timeframe: "When this will be significant (near/mid/long term)"
      evidence:
        - "Supporting data or observation"
      implications_for_us: "What this means for our strategy"
      
  market:
    - trend: "Example: Shift to remote-first work"
      impact: "medium"
      timeframe: "near term"
      evidence:
        - "Market research showing X% adoption"
      implications_for_us: "Creates need for async collaboration tools"
      
  user_behavior:
    - trend: "Example: Increasing expectation for real-time data"
      impact: "high"
      timeframe: "near term"
      evidence:
        - "User research findings"
      implications_for_us: "Must prioritize performance"
      
  regulatory:
    - trend: "Example: New data privacy regulations"
      impact: "medium"
      timeframe: "mid term"
      evidence:
        - "Pending legislation"
      implications_for_us: "Will require privacy-first architecture"
      
  competitive:
    - trend: "Example: Consolidation in our category"
      impact: "high"
      timeframe: "near term"
      evidence:
        - "Recent acquisitions"
      implications_for_us: "Window to establish position before market locks"

key_insights:
  - insight: "Major insight synthesized from trends"
    supporting_trends:
      - "Trend that supports this insight"
    strategic_implication: "What this means for our strategy (the 'why now')"

## 2. MARKET ANALYSIS: What does the playing field look like?

market_definition:
  tam:
    size: "Total Addressable Market estimate"
    calculation_method: "How the estimate was derived"
  sam:
    size: "Serviceable Addressable Market estimate"
    definition: "Which part of the TAM we can serve and why"
  som:
    size: "Serviceable Obtainable Market (realistic initial target)"
    timeframe: "Time horizon for reaching this share"
  market_stage: "emerging" # nascent, emerging, growth, mature, declining
  growth_rate: "XX% annual growth"

market_structure:
  segments:
    - segment: "Market Segment 1"
      size: "Estimate"
      characteristics:
        - "Key defining trait"
      unmet_needs:
        - "Primary unmet need of this segment"
      current_solutions: "How they solve today"
      willingness_to_pay: "low|medium|high"
      accessibility: "How hard to reach"
      
  value_chain:
    - stage: "Stage in the value chain (e.g., supplier, distributor, end user)"
      key_players:
        - "Who operates at this stage"
      value_captured: "Share of value this stage captures"
      power: "Their relative power (low|medium|high)"
      needs: "What they need from solution"

competitive_landscape:
  direct_competitors:
    - name: "Competitor 1"
      positioning: "How they position themselves"
      strengths:
        - "Key strength"
      weaknesses:
        - "Key weakness"
      market_share: "Estimated %"
      target_segment: "Who they serve"
      business_model: "How they monetize"
      
  indirect_competitors:
    - name: "Alternative solution"
      how_they_solve: "How users currently solve the problem"
      threat_level: "medium" # low, medium, high
      switching_cost: "low|medium|high"
      
  substitutes:
    - substitute: "What users might do instead"
      adoption: "How common this substitute is"

barriers_to_entry:
  - barrier: "Technical complexity"
    height: "high|medium|low"
    our_position: "How we can overcome"

market_dynamics:
  - dynamic: "Key market dynamic or force"
    implication: "What this means for us"

white_spaces:
  - gap: "Underserved segment or need we could target"
    evidence:
      - "What shows this gap exists"
    opportunity_potential: "How large the opportunity could be"

## 3. INTERNAL ANALYSIS (SWOT)

strengths:
  - category: "capability" # capability, asset, relationship, position
    strength: "Specific strength we have"
    evidence:
      - "What proves this"
    strategic_value: "Why this matters for our strategy"
    defensibility: "How sustainable is this? (low|medium|high)"

weaknesses:
  - category: "capability" # capability, resource, knowledge, position
    weakness: "Specific limitation or gap"
    impact: "How this constrains us (low|medium|high)"
    addressable: "Can we fix this? (yes|partially|no)"
    mitigation: "How we can work around or address"
    urgency: "Do we need to fix this now? (critical|important|nice-to-have)"

opportunities:
  - opportunity: "External opportunity we can pursue"
    how_to_exploit: "How we would act on this opportunity"
    priority: "medium" # critical, high, medium, low
    fit_with_strengths: "Which strengths enable this?"
    addresses_trend: "Which trend creates this?"
    market_size: "How big is this?"
    timing: "When is the window? (now|soon|later)"
    required_investment: "low|medium|high"
    
threats:
  - threat: "External threat or risk"
    likelihood: "medium" # low, medium, high
    impact_if_occurs: "low|medium|high"
    related_weakness: "Does this exploit our weaknesses?"
    mitigation: "How we can defend or pivot"
    monitoring: "How we'll track this threat"

strategic_implications:
  - insight: "Key insight from SWOT synthesis"
    action: "What this tells us to do (or avoid)"

## 4. USER/PRODUCT PROBLEM ANALYSIS

target_users:
  - persona: "User Persona Name"
    description: "Who they are"
    current_state:
      goals:
        - "What they're trying to achieve"
      context: "When/where they do this"
      frequency: "How often they face this"
      
    problems:
      - problem: "Specific pain point"
        severity: "high" # critical, high, medium, low
        frequency: "How often they encounter this"
        current_solution: "How they cope today"
        workarounds:
          - "What they do to get by"
        cost_of_problem: "Time/money/frustration cost"
        willingness_to_solve: "high|medium|low"
        evidence:
          - "User research quote or data point"
          
    jobs_to_be_done:
      - job: "Functional job (what they need to accomplish)"
        when: "Situation that triggers the job"
        desired_outcome: "What success looks like for the user"
        emotional_job: "Emotional dimension (how they want to feel)"
        social_job: "Social dimension (how they want to be perceived)"
        current_performance: "How well current solutions work (poor|fair|good)"
        importance: "How important is this job? (critical|important|nice)"
        
product_problem_fit_analysis:
  problem_clarity: "How clearly the problem is understood, and the evidence for that"
  problem_severity: "How severe the problem is for the users who have it"
  solution_feasibility: "Whether we can build a solution, and the main risks"
  problem_severity_map:
    - problem: "Reference to problem above"
      affected_users: "How many users (% or number)"
      current_solution_gap: "How poorly is this served today (1-10)"
      opportunity_score: "severity × frequency × willingness (calculated)"
      
  problem_prioritization:
    - rank: 1
      problem: "Most critical problem to solve"
      rationale: "Why this is #1"
      
validation_status:
  - hypothesis: "Hypothesis that was tested"
    validation_method: "How we tested this (interviews|surveys|observation)"
    status: "pending" # validated, invalidated, pending, partially-validated
    evidence:
      - "What the test showed"
    sample_size: "N=X users"
    confidence: "low|medium|high"
    key_quote: "Representative user quote"
    quantitative_evidence: "Data that proves severity"

problem_solution_hypotheses:
  - problem: "Core problem"
    hypothesis: "We believe that if we [solution] then [outcome] because [assumption]"
    riskiest_assumptions:
      - "Assumption that must be true"
    test_approach: "How we could validate this quickly"

## Cross-Analysis Synthesis

opportunity_convergence:
  - opportunity: "The 'big opportunity' suggested by the convergence"
    supporting_analyses:
      - "Which analyses (trend, market, internal, problem) support it"
    strength: "How strong the convergence is"

strategic_tensions:
  - tension: "Where analyses conflict (e.g., big market but weak capability)"
    tradeoff: "What we give up whichever way we resolve it"
    resolution: "How we might resolve this tension"

confidence_gaps:
  - gap: "What we still do not know that matters"
    why_it_matters: "Why this gap affects the strategy"
    how_to_close: "Research or test that would close it"

next_analytical_steps:
  - step: "Additional analysis or research needed before STRATEGY phase"
    priority: "medium"
    owner: "Who will do it"
