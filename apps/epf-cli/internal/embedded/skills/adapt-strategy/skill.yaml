name: adapt-strategy
version: "1.1.0"
type: generation
phase: AIM
description: "Generates full replacement payloads for strategy_formula and roadmap_recipe based on a committed calibration decision. Consumes the calibration memo's learnings and next_cycle_focus (Start/Stop/Continue) as the primary driver of the rewrite when present, falling back to assessment-derived guidance for legacy/thin memos. Also produces an LRA evolution entry and updated riskiest assumptions."

capability:
  class: autonomous
  context_budget: large

requires:
  artifacts:
    - calibration_memo
    - assessment_report
    - strategy_formula
    - roadmap_recipe
    - living_reality_assessment

output:
  format: json
  schema: output_schema.json
  artifact_types:
    - strategy_formula
    - roadmap_recipe
    - living_reality_assessment
